name: Test build-from-source inputs rejected by invalid buildArguments
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create app source with Dockerfile
        run: |
          mkdir -p "$RUNNER_TEMP/app-src"
          printf 'FROM nginx:alpine\n' > "$RUNNER_TEMP/app-src/Dockerfile.custom"
      # The invalid buildArguments value guarantees the action fails in argument
      # validation, before it ever calls Azure (no credentials in the harness).
      - id: action
        uses: .
        continue-on-error: true
        with:
          appSourcePath: ${{ runner.temp }}/app-src
          dockerfilePath: Dockerfile.custom
          acrName: myacr
          acrUsername: testuser
          acrPassword: testpassword
          imageToBuild: myacr.azurecr.io/test/app:1.0
          builderStack: debian-bookworm
          runtimeStack: 'node:18'
          buildArguments: 'GOOD=1 BADARG'
          containerAppName: test-app
          disableTelemetry: 'true'
      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid buildArguments"
            exit 1
          fi
          echo "PASS"
