name: Test Azure login via azureCredentials before updating app (fake az)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake az CLI
        run: |
          mkdir -p /tmp/fakebin
          : > /tmp/az-calls.log
          cat > /tmp/fakebin/az <<'EOF'
          #!/bin/bash
          echo "az $*" >> /tmp/az-calls.log
          case "$*" in
            --version*) echo "azure-cli                         2.53.0" ;;
            "account show"*) echo '{"id":"00000000-0000-0000-0000-000000000003","tenantId":"00000000-0000-0000-0000-000000000002"}' ;;
          esac
          exit 0
          EOF
          chmod +x /tmp/fakebin/az
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          azureCredentials: '{"clientId":"00000000-0000-0000-0000-000000000001","clientSecret":"not-a-real-secret","subscriptionId":"00000000-0000-0000-0000-000000000003","tenantId":"00000000-0000-0000-0000-000000000002"}'
          imageToDeploy: myregistry.example.com/app:6.0
          containerAppName: cred-app
          resourceGroup: cred-rg
          disableTelemetry: 'true'
      - name: Assert az calls
        run: |
          echo "--- az calls ---"
          cat /tmp/az-calls.log
          grep -qE "^az login" /tmp/az-calls.log || { echo "FAIL: az login not called by azure/login"; exit 1; }
          grep -E "^az login" /tmp/az-calls.log | grep -qF "00000000-0000-0000-0000-000000000001" || { echo "FAIL: az login missing client id"; exit 1; }
          grep -qF "az containerapp update -g cred-rg -n cred-app -i myregistry.example.com/app:6.0" /tmp/az-calls.log || { echo "FAIL: update not called"; exit 1; }
          echo "PASS"
