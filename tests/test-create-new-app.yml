name: Test creation of new Container App with prebuilt image (fake az)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake az CLI
        run: |
          mkdir -p /tmp/fakebin
          : > /tmp/az-calls.log
          cat > /tmp/fakebin/az <<'EOF'
          #!/bin/bash
          echo "az $*" >> /tmp/az-calls.log
          case "$*" in
            "containerapp show"*) exit 3 ;;
            "containerapp env show"*) exit 3 ;;
          esac
          exit 0
          EOF
          chmod +x /tmp/fakebin/az
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          imageToDeploy: myregistry.example.com/app:2.0
          containerAppName: new-app
          resourceGroup: new-rg
          containerAppEnvironment: new-env
          environmentVariables: FOO=bar
          disableTelemetry: 'true'
      - name: Assert az calls
        run: |
          echo "--- az calls ---"
          cat /tmp/az-calls.log
          grep -qE "az containerapp env create -g new-rg -n new-env" /tmp/az-calls.log || { echo "FAIL: env create not called"; exit 1; }
          line="$(grep -E '^az containerapp create' /tmp/az-calls.log || true)"
          echo "create: $line"
          [ -n "$line" ] || { echo "FAIL: create not called"; exit 1; }
          for exp in "-g new-rg" "-n new-app" "-i myregistry.example.com/app:2.0" "--environment new-env" "--ingress external" "--target-port 80" "--env-vars FOO=bar"; do
            echo "$line" | grep -qF -- "$exp" || { echo "FAIL: missing '$exp'"; exit 1; }
          done
          if grep -q "az containerapp update" /tmp/az-calls.log; then echo "FAIL: update should not be called"; exit 1; fi
          echo "PASS"
