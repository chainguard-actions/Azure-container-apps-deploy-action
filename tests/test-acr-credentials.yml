name: Test ACR username/password with internal ingress and target port (fake az/docker)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake az and docker CLIs
        run: |
          mkdir -p /tmp/fakebin
          : > /tmp/az-calls.log
          : > /tmp/docker-calls.log
          cat > /tmp/fakebin/az <<'EOF'
          #!/bin/bash
          echo "az $*" >> /tmp/az-calls.log
          case "$*" in
            "containerapp show"*) exit 3 ;;
            "containerapp env show"*) exit 3 ;;
          esac
          exit 0
          EOF
          cat > /tmp/fakebin/docker <<'EOF'
          #!/bin/bash
          echo "docker $*" >> /tmp/docker-calls.log
          case "$*" in
            *--password-stdin*) cat > /dev/null ;;
          esac
          case "$1" in
            login) echo "Login Succeeded" ;;
          esac
          exit 0
          EOF
          chmod +x /tmp/fakebin/az /tmp/fakebin/docker
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          acrName: myacr
          acrUsername: acr-user
          acrPassword: acr-pass
          imageToDeploy: myacr.azurecr.io/app:3.0
          containerAppName: acr-app
          resourceGroup: acr-rg
          containerAppEnvironment: acr-env
          ingress: internal
          targetPort: '8080'
          disableTelemetry: 'true'
      - name: Assert calls
        run: |
          echo "--- az calls ---"
          cat /tmp/az-calls.log
          echo "--- docker calls ---"
          cat /tmp/docker-calls.log
          grep -E '^docker login' /tmp/docker-calls.log | grep -qF "myacr.azurecr.io" || { echo "FAIL: docker login to ACR not performed"; exit 1; }
          if grep -q "az acr login" /tmp/az-calls.log; then echo "FAIL: az acr login should not be used with credentials"; exit 1; fi
          line="$(grep -E '^az containerapp create' /tmp/az-calls.log || true)"
          echo "create: $line"
          [ -n "$line" ] || { echo "FAIL: create not called"; exit 1; }
          for exp in "-g acr-rg" "-n acr-app" "-i myacr.azurecr.io/app:3.0" "--environment acr-env" "--ingress internal" "--target-port 8080" "--registry-server myacr.azurecr.io" "--registry-username acr-user" "--registry-password acr-pass"; do
            echo "$line" | grep -qF -- "$exp" || { echo "FAIL: missing '$exp'"; exit 1; }
          done
          echo "PASS"
