name: Test registry credentials with conflicting acrName
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          imageToDeploy: myregistry.example.com/test/app:1.0
          registryUrl: myregistry.example.com
          registryUsername: testuser
          registryPassword: testpassword
          acrName: myacr
          containerAppName: test-app
          disableTelemetry: 'true'
      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when acrName and registryUrl are both provided"
            exit 1
          fi
          echo "PASS"
