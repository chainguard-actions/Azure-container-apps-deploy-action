name: Test appSourcePath without acrName fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          appSourcePath: ${{ github.workspace }}
          containerAppName: test-app
          resourceGroup: test-rg
          disableTelemetry: 'true'
      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when appSourcePath is given without acrName"
            exit 1
          fi
          echo "PASS"
