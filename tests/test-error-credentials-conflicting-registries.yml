name: Test validation fails when ACR and generic registry credentials are both provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake az CLI
        run: |
          mkdir -p /tmp/fakebin
          : > /tmp/az-calls.log
          cat > /tmp/fakebin/az <<'EOF'
          #!/bin/bash
          echo "az $*" >> /tmp/az-calls.log
          exit 0
          EOF
          chmod +x /tmp/fakebin/az
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          appSourcePath: /tmp/app
          acrName: myacr
          acrUsername: acr-user
          acrPassword: acr-pass
          registryUrl: registry.example.com
          registryUsername: reg-user
          registryPassword: reg-pass
          azureCredentials: '{"clientId":"x","clientSecret":"y","subscriptionId":"z","tenantId":"t"}'
          containerAppName: conflict-app
          resourceGroup: conflict-rg
          disableTelemetry: 'true'
      - name: Assert action failed before any login or az call
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "--- az calls ---"; cat /tmp/az-calls.log
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when both acrName and registryUrl are provided"
            exit 1
          fi
          if [ -s /tmp/az-calls.log ]; then
            echo "FAIL: az should not have been invoked after validation failure"
            exit 1
          fi
          echo "PASS"
