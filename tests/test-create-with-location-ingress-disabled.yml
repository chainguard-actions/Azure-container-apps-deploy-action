name: Test create app with location, generated resource group and ingress disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake az CLI
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          : > "$RUNNER_TEMP/az-calls.log"
          cat > "$RUNNER_TEMP/fakebin/az" <<'EOF'
          #!/bin/bash
          echo "az $*" >> "$RUNNER_TEMP/az-calls.log"
          case "$*" in
            "group show"*) exit 1 ;;
            "containerapp show"*) exit 1 ;;
            "containerapp env show"*) exit 1 ;;
            "containerapp env list"*) exit 0 ;;
          esac
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/az"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          imageToDeploy: myacr.azurecr.io/app:1.0
          containerAppName: loc-app
          location: westus2
          ingress: disabled
          disableTelemetry: 'true'
      - name: Assert resource group, environment and app created with location
        run: |
          LOG="$RUNNER_TEMP/az-calls.log"
          cat "$LOG"
          if ! grep -qF "az group create -n loc-app-rg -l westus2" "$LOG"; then
            echo "FAIL: resource group not created with location"; exit 1
          fi
          if grep -q '^az provider show' "$LOG"; then
            echo "FAIL: default location lookup should be skipped when location is given"; exit 1
          fi
          ENV=$(grep '^az containerapp env create' "$LOG" || true)
          echo "env create: $ENV"
          for expected in "-g loc-app-rg" "-n loc-app-env" "--location westus2"; do
            if ! echo "$ENV" | grep -qF -- "$expected"; then
              echo "FAIL: env create missing '$expected'"; exit 1
            fi
          done
          LINE=$(grep '^az containerapp create' "$LOG" || true)
          echo "create: $LINE"
          for expected in "-g loc-app-rg" "-n loc-app" "-i myacr.azurecr.io/app:1.0" "--environment loc-app-env"; do
            if ! echo "$LINE" | grep -qF -- "$expected"; then
              echo "FAIL: create missing '$expected'"; exit 1
            fi
          done
          if echo "$LINE" | grep -qF -- "--ingress"; then
            echo "FAIL: ingress arg should not be passed when disabled"; exit 1
          fi
          if echo "$LINE" | grep -qF -- "--target-port"; then
            echo "FAIL: target port should not be passed when ingress disabled"; exit 1
          fi
          echo "PASS"
