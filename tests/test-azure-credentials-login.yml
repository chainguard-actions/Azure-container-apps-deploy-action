name: Test Azure login via azureCredentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake az CLI
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          AZLOG="$RUNNER_TEMP/az-calls.log"
          : > "$AZLOG"
          cat > "$RUNNER_TEMP/fakebin/az" <<EOF
          #!/bin/bash
          echo "az \$*" >> "$AZLOG"
          case "\$*" in
            "--version"*) echo "azure-cli                         2.50.0" ; exit 0 ;;
            "containerapp show"*) exit 1 ;;
            "account show"*) echo '{"id":"00000000-0000-0000-0000-000000000004"}' ; exit 0 ;;
          esac
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/az"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          azureCredentials: '{"clientId":"00000000-0000-0000-0000-000000000001","clientSecret":"not-a-real-secret","tenantId":"00000000-0000-0000-0000-000000000003","subscriptionId":"00000000-0000-0000-0000-000000000004"}'
          imageToDeploy: myacr.azurecr.io/app:1.0
          containerAppName: test-app
          resourceGroup: test-rg
          containerAppEnvironment: test-env
          disableTelemetry: 'true'
      - name: Assert az login was performed and app created
        run: |
          AZLOG="$RUNNER_TEMP/az-calls.log"
          cat "$AZLOG" | sed 's/not-a-real-secret/***/g'
          LOGIN=$(grep -E '^az login' "$AZLOG" || true)
          if [ -z "$LOGIN" ]; then echo "FAIL: az login not called"; exit 1; fi
          for expected in "--service-principal" "00000000-0000-0000-0000-000000000001" "00000000-0000-0000-0000-000000000003"; do
            if ! echo "$LOGIN" | grep -qF -- "$expected"; then echo "FAIL: az login missing '$expected'"; exit 1; fi
          done
          LINE=$(grep '^az containerapp create' "$AZLOG" || true)
          echo "create: $LINE"
          if ! echo "$LINE" | grep -qF -- "-i myacr.azurecr.io/app:1.0"; then echo "FAIL: create not called with image"; exit 1; fi
          echo "PASS"
