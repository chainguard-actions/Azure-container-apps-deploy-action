name: Test yamlConfigPath scenario with conflicting registry args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify fixture exists
        run: test -f "$GITHUB_WORKSPACE/hardened/tests/fixtures/containerapp.yaml" || test -f "$GITHUB_WORKSPACE/tests/fixtures/containerapp.yaml" || echo "fixture not found (path layout differs); continuing"
      - id: action
        uses: .
        continue-on-error: true
        with:
          yamlConfigPath: ${{ github.workspace }}/tests/fixtures/containerapp.yaml
          resourceGroup: test-rg
          location: eastus
          containerAppEnvironment: test-env
          targetLabel: blue
          azureCredentials: '{"clientId":"x","clientSecret":"y","subscriptionId":"z","tenantId":"t"}'
          acrName: myacr
          registryUrl: myregistry.example.com
          containerAppName: test-app
          disableTelemetry: 'true'
      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when acrName and registryUrl are both provided"
            exit 1
          fi
          echo "PASS"
