name: Test azureCredentials provided without any source fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          azureCredentials: '{"clientId":"x","clientSecret":"y","subscriptionId":"z","tenantId":"t"}'
          containerAppName: test-app
          disableTelemetry: 'true'
      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no appSourcePath/imageToDeploy/yamlConfigPath given"
            exit 1
          fi
          echo "PASS"
