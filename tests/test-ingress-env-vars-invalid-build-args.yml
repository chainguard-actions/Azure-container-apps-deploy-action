name: Test ingress/targetPort/environmentVariables with invalid buildArguments
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          imageToDeploy: mcr.microsoft.com/azuredocs/containerapps-helloworld:latest
          ingress: internal
          targetPort: '8080'
          environmentVariables: 'FOO=bar BAZ=secretref:mysecret'
          buildArguments: 'NOEQUALS'
          containerAppName: test-app
          disableTelemetry: 'true'
      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid buildArguments"
            exit 1
          fi
          echo "PASS"
