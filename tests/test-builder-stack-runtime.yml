name: Test Oryx builder path with explicit builderStack and runtimeStack (fake az, docker, pack, curl)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake tools and app source
        run: |
          mkdir -p /tmp/fakebin /tmp/app /tmp/packsrc
          : > /tmp/az-calls.log
          : > /tmp/docker-calls.log
          : > /tmp/pack-calls.log
          cat > /tmp/fakebin/az <<'EOF'
          #!/bin/bash
          echo "az $*" >> /tmp/az-calls.log
          case "$*" in
            "acr login"*) echo '{"accessToken":"tok123"}' ;;
            "containerapp show"*) exit 3 ;;
            "containerapp env show"*) exit 3 ;;
          esac
          exit 0
          EOF
          cat > /tmp/fakebin/docker <<'EOF'
          #!/bin/bash
          echo "docker $*" >> /tmp/docker-calls.log
          exit 0
          EOF
          cat > /tmp/fakebin/pack <<'EOF'
          #!/bin/bash
          echo "pack $*" >> /tmp/pack-calls.log
          exit 0
          EOF
          cp /tmp/fakebin/pack /tmp/packsrc/pack
          tar -czf /tmp/pack.tgz -C /tmp/packsrc pack
          # Fake curl: serve the fake pack tarball, honoring -o for hardened download-to-file form
          cat > /tmp/fakebin/curl <<'EOF'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *buildpacks/pack*)
              if [ -n "$out" ]; then
                cat /tmp/pack.tgz > "$out"
              else
                cat /tmp/pack.tgz
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          EOF
          # Fake sudo: run the command directly (skip if /usr/local/bin is not writable)
          cat > /tmp/fakebin/sudo <<'EOF'
          #!/bin/bash
          if [ "$1" = "tar" ] && [ ! -w /usr/local/bin ]; then cat > /dev/null 2>&1 || true; exit 0; fi
          exec "$@"
          EOF
          chmod +x /tmp/fakebin/*
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
          echo '{"name":"app"}' > /tmp/app/package.json
      - id: action
        uses: .
        with:
          appSourcePath: /tmp/app
          acrName: myacr
          builderStack: debian-bullseye-20231004.1
          runtimeStack: 'node:18'
          containerAppName: builder-app
          resourceGroup: builder-rg
          containerAppEnvironment: builder-env
          disableTelemetry: 'true'
      - name: Assert calls
        run: |
          echo "--- az calls ---"; cat /tmp/az-calls.log
          echo "--- docker calls ---"; cat /tmp/docker-calls.log
          echo "--- pack calls ---"; cat /tmp/pack-calls.log
          grep -qF "pack config default-builder mcr.microsoft.com/oryx/builder:debian-bullseye-20231004.1" /tmp/pack-calls.log || { echo "FAIL: default builder not configured"; exit 1; }
          grep -qF "pack config experimental true" /tmp/pack-calls.log || { echo "FAIL: experimental not enabled"; exit 1; }
          builds="$(grep -c '^pack build' /tmp/pack-calls.log || true)"
          [ "$builds" = "1" ] || { echo "FAIL: expected exactly one pack build, got $builds"; exit 1; }
          line="$(grep -E '^pack build' /tmp/pack-calls.log)"
          echo "build: $line"
          for exp in "myacr.azurecr.io/github-action/container-app:" "--path /tmp/app" "--builder mcr.microsoft.com/oryx/builder:debian-bullseye-20231004.1" "--env ORYX_PLATFORM_NAME=node" "--env ORYX_PLATFORM_VERSION=18" "--env ORYX_RUNTIME_PORT=80" "--env ORYX_DISABLE_TELEMETRY=true"; do
            echo "$line" | grep -qF -- "$exp" || { echo "FAIL: missing '$exp'"; exit 1; }
          done
          grep -qF "docker push myacr.azurecr.io/github-action/container-app:" /tmp/docker-calls.log || { echo "FAIL: docker push not called"; exit 1; }
          grep -qE "^az containerapp create .*-i myacr.azurecr.io/github-action/container-app:" /tmp/az-calls.log || { echo "FAIL: create with built image not called"; exit 1; }
          echo "PASS"
