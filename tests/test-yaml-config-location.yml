name: Test YAML config only deployment with location and generated resource group (fake az)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake az CLI and write YAML config
        run: |
          mkdir -p /tmp/fakebin
          : > /tmp/az-calls.log
          cat > /tmp/fakebin/az <<'EOF'
          #!/bin/bash
          echo "az $*" >> /tmp/az-calls.log
          case "$*" in
            "group show"*) exit 3 ;;
            "containerapp show"*) exit 3 ;;
            "containerapp env show"*) exit 3 ;;
          esac
          exit 0
          EOF
          chmod +x /tmp/fakebin/az
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
          cat > /tmp/containerapp.yaml <<'EOF'
          properties:
            template:
              containers:
                - image: myregistry.example.com/app:yaml
                  name: yaml-app
          EOF
      - id: action
        uses: .
        with:
          yamlConfigPath: /tmp/containerapp.yaml
          containerAppName: yaml-app
          location: westus2
          disableTelemetry: 'true'
      - name: Assert az calls
        run: |
          echo "--- az calls ---"
          cat /tmp/az-calls.log
          grep -qF "az group show -n yaml-app-rg" /tmp/az-calls.log || { echo "FAIL: group show not called"; exit 1; }
          grep -qF "az group create -n yaml-app-rg -l westus2" /tmp/az-calls.log || { echo "FAIL: group create with location not called"; exit 1; }
          if grep -q "az provider show" /tmp/az-calls.log; then echo "FAIL: default location should not be looked up"; exit 1; fi
          grep -qF "az containerapp create -g yaml-app-rg -n yaml-app --yaml /tmp/containerapp.yaml --output none" /tmp/az-calls.log || { echo "FAIL: yaml create not called"; exit 1; }
          if grep -q "az containerapp env" /tmp/az-calls.log; then echo "FAIL: env commands should be skipped with YAML"; exit 1; fi
          if grep -q "az containerapp update" /tmp/az-calls.log; then echo "FAIL: update should not be called"; exit 1; fi
          echo "PASS"
